services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demirbas
      POSTGRES_PASSWORD: demirbas
      POSTGRES_DB: demirbas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demirbas -d demirbas"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://demirbas:demirbas@db:5432/demirbas
      JWT_SECRET: degistirin-uzun-bir-gizli-anahtar
      JWT_EXPIRES_IN: 8h
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
